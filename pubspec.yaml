name: shared_utils
description: "مكتبة أدوات مشتركة للمشاريع - تتضمن معالجة API، extensions، formatters، وأدوات مساعدة"

version: 3.7.0

homepage: https://github.com/AbberApp/shared_utils

environment:
  # الحدّان يعكسان ما تفرضه التبعيات فعلاً (in_app_update و fluttertoast)، لا قيمة
  # `flutter create` الافتراضيّة: حدٌّ أدنى كاذب يجعل pub يفشل باسم تبعيةٍ أخرى
  # بدل أن يقول إنّ المكتبة نفسها تحتاج أحدث. راجعهما كلّما رُفعت تبعيةٌ بحدٍّ أعلى.
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter

  # Network
  audio_session: ^0.2.4
  sentry_flutter: ^10.0.0-rc.2
  bloc: ^9.2.1
  # أحدث إصدار، وفرضٌ على كلّ التطبيقات: تُعلَن هنا وحدها وتُصدَّر من البرميل.
  equatable: ^3.0.0
  dio: ^5.11.1
  # ^7.3.1 لا ^7.3.2: نسخة 7.3.2 ترفع nm إلى ^0.6.0 الذي يطلب dbus ^0.8.0.
  # flutter_local_notifications صار يقبلها (23.0.0-dev، والتطبيقات كلّها عليه منذ
  # 3.7.0)، لكنّ geolocator_linux 0.2.6 — أحدث إصدار، في «عزبة» — يثبّت dbus ^0.7.3،
  # فرفعُ الحدّ يُفشل حلّ تبعياتها. و^7.3.1 لا يمنع 7.3.2 حيث يَسَع المُحلِّلَ.
  connectivity_plus: ^7.3.1
  web_socket_channel: ^3.0.3

  # File & Image Pickers
  file_picker: ^13.1.0
  image_picker: ^1.2.4
  image_cropper: ^12.2.1

  # UI
  fluttertoast: ^10.0.2
  skeletonizer: ^3.0.0

  # Storage
  path_provider: ^2.1.6

  # Utils
  intl: ^0.20.3
  phone_numbers_parser: ^9.0.28
  url_launcher: ^6.3.3
  share_plus: ^13.3.1
  # open_file لا open_filex: الأصل المُصان ويدعم SPM عبر open_file_ios،
  # بينما open_filex بلا Package.swift فتُبقي CocoaPods حيّة.
  open_file: ^4.0.0

  # Device Info
  device_info_plus: ^13.3.0
  package_info_plus: ^10.2.2
  persistent_device_id: ^2.0.0

  # App Update
  in_app_update: ^5.0.0
  json_annotation: ^4.12.0

  meta: ^1.19.0

  # ── ما كانت التطبيقات تعلنه كلٌّ بنفسه (3.7.0) ─────────────────────────────
  # على أحدث إصدار، وفرضٌ على الجميع: تُعلَن هنا وحدها وتُصدَّر من البرميل.
  #
  # والشرط لدخول هذه القائمة: ألّا تُدخل الحزمة كوداً أصلياً جديداً على أيّ تطبيق
  # — فما لا يستعمله تطبيقٌ منها يحذفه البناء ولا يدفع ثمنه. أمّا الإضافات
  # الأصلية (firebase، camera، record، local_auth…) فلا تدخل هنا أبداً: كانت
  # ستحمل كودها وأذوناتها إلى كلّ تطبيق، وأبل ترفض تطبيقاً يربط الكاميرا أو
  # الميكروفون بلا وصف استخدام. تبقى في كلّ تطبيق بقيدٍ واحد على أحدث إصدار.
  # وكذلك cached_network_image (تجرّ sqflite) وflutter_widget_from_html
  # (تجرّ مشغّلَي الصوت والفيديو وwebview)، وpath (تُستورد ببادئة `as p`).

  # الحالة والحقن
  flutter_bloc: ^9.1.1
  bloc_concurrency: ^0.3.0
  get_it: ^9.3.0
  dartz: ^0.10.1

  # الواجهة
  solar_community_icons: ^1.1.1
  flutter_svg: ^2.3.0
  lottie: ^3.6.1
  photo_view: ^0.15.0
  grouped_list: ^6.0.0
  custom_timer: ^0.2.3
  confetti: ^0.8.0
  animate_do: ^5.1.0
  showcaseview: ^5.1.0
  # 6.0.2 لا 7.0.0: السابعة انتقلت إلى material_ui، ومؤلّفها يقول إنّ التطبيقات
  # التي على package:flutter/material.dart تبقى على 6.x — وكلّ تطبيقاتنا عليها.
  # جُرّبت: Pinput 7 داخل Scaffold من flutter/material يرمي «No Material widget
  # found». تُرفع إلى 7 مع انتقال التطبيقات إلى material_ui، لا قبله.
  pinput: ^6.0.2

  # التخزين والإعداد
  hive_ce_flutter: ^2.4.0
  flutter_dotenv: ^6.0.1

  # التشفير والدفع والهويّة
  pointycastle: ^4.0.0
  basic_utils: ^5.8.2
  credit_card_type_detector: ^3.0.0
  jwt_decoder: ^2.0.1
  uuid: ^4.6.0
  ip_country_lookup: ^1.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # محاكاة للاختبارات: طبقتا الشبكة والأجهزة تعتمدان على plugins لا تعمل
  # في بيئة الاختبار، فبدون محاكاة تبقيان خارج التغطية تماماً.
  mocktail: ^1.0.5

flutter:
