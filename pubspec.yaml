name: shared_utils
description: "مكتبة أدوات مشتركة للمشاريع - تتضمن معالجة API، extensions، formatters، وأدوات مساعدة"

version: 2.15.0

homepage: https://github.com/AbberApp/shared_utils

environment:
  sdk: ^3.9.2
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter

  # Network
  audio_session: ^0.2.4
  sentry_flutter: ^9.27.0
  bloc: ^9.2.1
  dio: ^5.11.0
  connectivity_plus: ^7.3.1
  web_socket_channel: ^3.0.3

  # File & Image Pickers
  file_picker: ^12.0.0
  image_picker: ^1.2.3
  image_cropper: ^12.2.1

  # UI
  fluttertoast: ^10.0.0
  skeletonizer: ^2.1.3

  # Storage
  path_provider: ^2.1.6

  # Utils
  intl: ^0.20.3
  phone_numbers_parser: ^9.0.25
  url_launcher: ^6.3.2

  # Device Info
  device_info_plus: ^13.2.0
  package_info_plus: ^10.2.1
  persistent_device_id: ^2.0.0

  # App Update
  in_app_update: ^5.0.0
  json_annotation: ^4.12.0

  # مستورد مباشرةً في app_update_checker.dart (@immutable)
  meta: ^1.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
